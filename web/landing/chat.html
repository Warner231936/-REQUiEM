<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requiem // Chat</title>
    <meta name="description" content="Requiem Cognitive AI Chat">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #12122a 50%, #0a0a1a 100%);
            --card-bg: rgba(15, 15, 35, 0.9);
            --card-border: rgba(100, 200, 255, 0.2);
            --primary: #00d4ff;
            --accent: #ff00ff;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b0;
            --success: #00ff88;
            --error: #ff4466;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(15, 15, 35, 0.95);
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }
        .chat-header .logo {
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-transparent;
            background-clip: text;
        }
        .chat-header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .user-email {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .chat-header .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 68, 102, 0.15);
            border: 1px solid var(--error);
            border-radius: 6px;
            color: var(--error);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chat-header .logout-btn:hover {
            background: rgba(255, 68, 102, 0.3);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message {
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .message.user {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            margin-left: auto;
            border-radius: 16px 4px 16px 16px;
        }
        .message.assistant {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            margin-right: auto;
            border-radius: 4px 16px 16px 16px;
        }
        .message.assistant strong {
            color: var(--accent);
        }
        .thinking {
            opacity: 0.6;
            font-style: italic;
        }
        .chat-input {
            padding: 20px 24px;
            background: rgba(15, 15, 35, 0.95);
            border-top: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }
        .chat-input .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        .chat-input textarea {
            flex: 1;
            padding: 14px 16px;
            background: rgba(10, 10, 20, 0.5);
            border: 2px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input textarea:focus {
            border-color: var(--primary);
        }
        .chat-input button {
            padding: 14px 24px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            align-self: flex-end;
        }
        .chat-input button:hover { transform: translateY(-2px); }
        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-bar {
            padding: 8px 24px;
            background: rgba(15, 15, 35, 0.95);
            border-top: 1px solid var(--card-border);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <div class="logo">REQUIEM</div>
        <div class="user-info">
            <span class="user-email" id="userEmail">user@example.com</span>
            <button class="logout-btn" id="adminBtn" style="display:none; background:rgba(74,0,255,0.15); border-color:#4a00ff; color:#00d4ff;" onclick="goToAdmin()">Admin Panel</button>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
            <strong>Requiem:</strong> Hello! I'm your cognitive AI. I have persistent memory and multi-stage reasoning. What would you like to discuss?
        </div>
    </div>

    <div class="chat-input">
        <div class="input-container">
            <textarea id="messageInput" placeholder="Type your message..." rows="1" maxlength="2000"></textarea>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="status-bar">
        <span>Connected • Cognitive Pipeline Active</span>
    </div>

    <script>
        const API_BASE = '/api';
        let currentEmail = 'user@example.com';
        let conversationId = null;

        async function loadUser() {
            try {
                const res = await fetch(`${API_BASE}/auth/me`, {
                    credentials: 'include'
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('userEmail').textContent = data.email || 'user@example.com';
                    currentEmail = data.email || 'user@example.com';
                    if (data.is_admin) {
                        document.getElementById('adminBtn').style.display = 'inline-block';
                    }
                } else {
                    window.location.href = '/';
                }
            } catch (e) {
                window.location.href = '/';
            }
        }

        function goToAdmin() {
            window.location.href = '/admin/';
        }

        async function handleLogout() {
            await fetch(`${API_BASE}/auth/logout`, {
                method: 'POST',
                credentials: 'include'
            });
            window.location.href = '/';
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            const thinkingMsg = addMessage('assistant', '<strong>Requiem:</strong> <span class="thinking">Reasoning...</span>');

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        message: message,
                        conversation_id: conversationId
                    })
                });

                const data = await res.json();
                const response = data.response || 'No response';

                if (data.conversation_id) {
                    conversationId = data.conversation_id;
                }

                thinkingMsg.innerHTML = '<strong>Requiem:</strong> ' + escapeHtml(response);
                scrollToBottom();
            } catch (err) {
                thinkingMsg.innerHTML = '<strong>Requiem:</strong> <span style="color: var(--error);">Error: ' + escapeHtml(err.message || 'Connection failed') + '</span>';
            }

            input.disabled = false;
            document.getElementById('sendButton').disabled = false;
            input.focus();
        }

        function addMessage(type, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.innerHTML = text;
            container.appendChild(div);
            scrollToBottom();
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        loadUser();
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
